name: One-time Next.js security bump

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-next-14.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update Next.js and lockfile
        run: npm install next@14.2.35 --save-exact --package-lock-only

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Upgrade Next.js to patched 14.2.35"
          git push origin HEAD:main
